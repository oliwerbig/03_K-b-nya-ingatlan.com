[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobanya-ingatlan-tdk"
version = "0.3.0"
description = "IFK-TDK 2026: vasuti ingatlanpiaci hatasok — notebook-alapu, kanonizalt riportpipeline"
requires-python = ">=3.11"
readme = "README.md"
# Fuggosegeket a requirements.txt kezeli (teljes, pinelt freeze).

[project.scripts]
tdk-report = "ingatlan_tdk.cli:report_main"
tdk-verify = "ingatlan_tdk.cli:verify_main"

[tool.setuptools.packages.find]
where = ["src"]