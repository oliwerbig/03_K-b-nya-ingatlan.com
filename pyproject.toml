[project]
name = "kobanya-ingatlan-tdk"
version = "0.1.0"
description = "IFK-TDK 2026: Kobanya ingatlanpiaci es terokonometriai kutatas (Becs benchmarkkal)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "archive", "html_reports", ".git"]

[tool.ruff.lint]
# Lenyens indulo szabalykeszlet (CONTRIBUTING.md 11. szakasz):
# E4 = import-formazas, E7 = utasitas-hibak, E9 = szintaxis-hibak, F = pyflakes.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Utvonal-bootstrap minta: a sys.path beallitas SZANDEKOSAN elozi meg az importokat
# (lapos struktura, lasd CONTRIBUTING.md). Az E402 ezekben a fajlokban elfogadott.
"generate_area_report.py" = ["E402"]
"report_engine/full_analyzer.py" = ["E402"]
"tests/test_integrity.py" = ["E402"]
