# ==============================================================================
# IFK-TDK 2026: Területi Adatbázis Konfiguráció (Multi-Area Configuration) v2
# ==============================================================================
# A területek EGYETLEN regisztere. A kódban SEHOL nincs beégetett területnév —
# minden futtatás innen olvassa az adathalmazok azonosítóit, útvonalait,
# adatforrásait és pénznemeit.

version: 2
active_area: "kobanya"

# --- Geokódolás (kizárólag cím-alapú; a portál-koordináták soha nem pontosak) ---
geocoding:
  service: "nominatim"
  user_agent: "IFK-TDK-2026-Research/1.0 (educational research; contact: github.com/oliwerbig)"
  rate_limit_s: 1.1               # Nominatim felhasználási szabályzat: 1 kérés/mp
  cache_dir: "data/geocoding"     # permanens, verziózott cache — determinisztikus újrafuttatás
  timeout_s: 30

# --- Globális pufferek (minden OSM/POI letöltés legalább 2000 m) ---
buffers:
  rail_buffer_m: 2000
  poi_buffer_m: 2000
  network_buffer_m: 2000

areas:
  # ----------------------------------------------------------------------------
  # FŐ MINTATERÜLET: Budapest X. kerület (Kőbánya) — ingatlan.com
  # ----------------------------------------------------------------------------
  kobanya:
    id: "kobanya"
    name: "Budapest X. kerület (Kőbánya)"
    short_name: "Kőbánya"
    role: "primary"                    # primary | control
    is_active: true
    source: "ingatlan.com"
    extractor: "extract_ingatlancom_html"
    currency: "HUF"
    currency_symbol: "Ft"
    unit_sqm: "Ft/m²"
    unit_total: "Ft"
    unit_million: "M Ft"
    unit_rent: "Ft/hó"
    eur_huf_rate: null                 # HUF-terület, nincs átváltás
    data:
      raw_dir: "data/raw/kobanya"
      extracted_xlsx: "data/extracted/kobanya_nyers.xlsx"
      extract_log: "data/extracted/kobanya_extract_log.csv"
      inventory: "data/extracted/kobanya_inventory.csv"
      mapping: "data/mappings/kobanya.yaml"
      street_file: "data/raw/osm_streets_kobanya_2000m.json"
      transit_file: "data/raw/osm_kobanya_transit_2000m.json"
      poi_file: "data/poi_kobanya_buffered.geojson"
      master_parquet: "data/processed/kobanya_szamitott_master.parquet"
      human_xlsx: "data/processed/kobanya_szamitott_emberi.xlsx"
      pontos_geojson: "data/processed/kobanya_szamitott_pontos.geojson"
    spatial:
      center_lat: 47.475
      center_lon: 19.120
      main_station: "Kőbánya alsó vasútállomás"
      fallback_stations:
        - ["Kőbánya felső vasútállomás", 47.4936, 19.1278]
        - ["Kőbánya alsó vasútállomás", 47.4851, 19.1309]
        - ["Kőbánya-Kispest vasútállomás", 47.4644, 19.1492]
        - ["Rákos vasútállomás", 47.4997, 19.1678]
    metadata:
      description: "Fő mintaterület: poszt-szocialista vasúti paradoxon és barnamezős diszkont vizsgálata"

  # ----------------------------------------------------------------------------
  # NEMZETKÖZI BENCHMARK: Bécs 2. kerület (Leopoldstadt / Nordbahnhof) — willhaben.at
  # ----------------------------------------------------------------------------
  leopoldstadt:
    id: "leopoldstadt"
    name: "Bécs 2. kerület (Leopoldstadt / Nordbahnhof)"
    short_name: "Bécs Leopoldstadt"
    role: "control"
    is_active: true
    source: "willhaben.at"
    extractor: "extract_willhaben_html"
    currency: "EUR"
    currency_symbol: "€"
    unit_sqm: "€/m²"
    unit_total: "€"
    unit_million: "k €"
    unit_rent: "€/hó"
    # Rögzített, dokumentált átváltási árfolyam: ECB napi referencia, 2026-10-08
    # (forrás: data-api.ecb.europa.eu, D.HUF.EUR.SP00.A)
    eur_huf_rate: 366.25
    data:
      raw_dir: "data/raw/leopoldstadt"
      extracted_xlsx: "data/extracted/leopoldstadt_nyers.xlsx"
      extract_log: "data/extracted/leopoldstadt_extract_log.csv"
      inventory: "data/extracted/leopoldstadt_inventory.csv"
      mapping: "data/mappings/leopoldstadt.yaml"
      street_file: "data/raw/osm_streets_leopoldstadt_2000m.json"
      transit_file: "data/raw/osm_leopoldstadt_transit_2000m.json"
      poi_file: "data/poi_leopoldstadt_buffered.geojson"
      master_parquet: "data/processed/leopoldstadt_szamitott_master.parquet"
      human_xlsx: "data/processed/leopoldstadt_szamitott_emberi.xlsx"
      pontos_geojson: "data/processed/leopoldstadt_szamitott_pontos.geojson"
    spatial:
      center_lat: 48.2183
      center_lon: 16.3925
      main_station: "Wien Praterstern"
      fallback_stations:
        - ["Wien Praterstern", 48.2188, 16.3924]
        - ["Wien Traisengasse", 48.2325, 16.3881]
        - ["Wien Handelskai", 48.2422, 16.3850]
        - ["Wien Franz-Josefs-Bahnhof", 48.2267, 16.3611]
        - ["Wien Mitte", 48.2056, 16.3842]
    metadata:
      description: "Nemzetközi Best Practice: modern bécsi vasúti barnamezős megújítás és TOD tranzit-fejlesztés"