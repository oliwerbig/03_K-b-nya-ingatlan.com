# ==============================================================================
# IFK-TDK 2026 Kutatási Adatséma (Data Schema Specification) — KANONIKUS VÁLTOZAT v2
# ==============================================================================
# Az EGYETLEN, adatforrás-agnosztikus kanonikus adatséma. A processed réteg
# (data/processed/<dataset>/) minden adathalmaza ehhez illeszkedik.
# A sávhatárok, címkék, pufferek és típusok EGYETLEN forrása ez a fájl.

version: 2

# ==============================================================================
# Szigorúan rögzített kutatási sávrendszerek (Canon Bins)
# ==============================================================================
immission_bands:
  metric: "euklideszi"             # légvonali távolság a legközelebbi vágánytól
  bins: [0, 150, 300, 500, 1000, 2000]
  labels:
    - "<150 m"
    - "150-300 m"
    - "300-500 m"
    - "500-1000 m"
    - "1000-2000 m"
    - ">2000 m (referencia)"
  reference: ">2000 m (referencia)"

isochrone_bands:
  metric: "halozati"               # hálózati sétatávolság, 1.25 m/s
  speed_ms: 1.25
  speed_m_per_min: 75.0
  bins: [0, 375, 750, 1125]
  labels:
    - "0-375 m (5 perc)"
    - "375-750 m (10 perc)"
    - "750-1125 m (15 perc)"
  reference: ">1125 m (kívül)"

poi_bands:
  metric: "halozati"
  bins: [0, 375, 750, 1125]
  columns: ["poi_5p_count", "poi_10p_count", "poi_15p_count"]

era_bands:
  source: "epulet_kora_ev"         # épületkor (év), a crawl-évből levezetve
  bins: [0, 10, 30, 60]
  labels:
    - "0-10 év (új)"
    - "10-30 év (rendszerváltás utáni)"
    - "30-60 év (panel-korszak)"
    - "60+ év (háború előtti)"

# ==============================================================================
# Letöltési pufferek — MINDEN OSM/POI letöltés legalább 2000 m pufferrel!
# ==============================================================================
buffers:
  rail_buffer_m: 2000
  poi_buffer_m: 2000
  network_buffer_m: 2000
  min_buffer_m: 2000               # globális minimum-szabály

# ==============================================================================
# Kötelező mezők (Required Columns) — minden processed masterben létezniük kell
# ==============================================================================
required:
  # Alapazonosítók és cím (a cím az ELSŐDLEGES helymeghatározó!)
  listing_id: "object"
  listing_type: "object"           # "elado" | "kiado"
  ingatlan_tipus: "object"         # lakas | haz | ipari | ... (a kutatási mintaszűrés kulcsa)
  cim_teljes: "object"
  iranyitoszam: "object"
  varos: "object"
  utca: "object"
  hazszam: "object"
  cim_forras: "object"             # strukturált | szöveges | hiányzik
  url: "object"
  gyujtes_datuma: "object"         # crawl-dátum (index.csv / manifest)

  # Pénzügyi és ármutatók
  price_huf: "float64"
  ar_millio_ft: "float64"
  ar_ezer_ft_ho: "float64"        # kiadó havi bérleti díj ezer Ft-ban (eladónál NaN)
  nm_ar_huf: "float64"
  log_ar: "float64"
  log_nm_ar: "float64"
  is_ar_outlier: "int64"

  # Ingatlanfizikai paraméterek
  alapterulet_nm: "float64"
  korrigalt_alapterulet_nm: "float64"
  szobaszam_osszes: "float64"
  szobaszam_kategoria: "object"    # 1 szoba | 2 szoba | 3 szoba | 4+ szoba
  allapot_kod: "int64"             # 1..6: 1=felújítandó, 2=közepes, 3=jó, 4=felújított, 5=újszerű, 6=új építésű
  is_felujitando: "int64"
  is_ujszeru_vagy_uj: "int64"
  is_panel: "int64"
  is_tegla: "int64"
  has_lift: "int64"
  has_klima: "int64"
  has_erkely: "int64"
  is_foldszint: "int64"
  is_zaroszint: "int64"
  is_tetoter: "int64"
  epulet_kora_ev: "float64"        # NaN-honest: hiányzó építési év -> NaN (SOHA 0)

  # Geokódolás — KIZÁRÓLAG cím-alapú (a portál-koordináták soha nem pontosak)
  geokodolt_lat: "float64"
  geokodolt_lon: "float64"
  geokodolas_modszere: "object"    # "cim_nominatim"
  geokodolas_pontossag: "object"   # hazszam | utca | korzet | nincs
  minta_garantalt_pontos: "int64"  # 1 ⇔ hazszam-szintű címgeokódolás

  # Sáv 1: Vasúti immissziós sávok (légvonali távolság a vágánytól)
  tavolsag_vasut_m: "float64"
  vasut_zona: "object"
  is_vasut_immisszio_150m: "int64"

  # Sáv 2: Vasúti gyalogos izokrónok (állomástól mért HÁLÓZATI távolság)
  tavolsag_vasut_halozati_m: "float64"
  menetido_vasut_gyalog_perc: "float64"
  vasut_5p_seta: "int64"
  vasut_10p_seta: "int64"
  vasut_15p_seta: "int64"

  # Adatminőség
  is_duplikalt_gyanus: "int64"     # azonos cím+terület+ár duplikátum-jelölő

# ==============================================================================
# Opcionális mezők (Optional Columns - ha az adatforrás szolgáltatja)
# ==============================================================================
optional:
  varosresz: "object"
  title: "object"                 # a hirdetés portál-címe (nem minden forrásnál értelmes)
  allapot: "object"                # nyers állapot-szöveg
  ingatlan_altipus: "object"
  epites_eve: "float64"
  epites_eve_kategoria: "object"
  epites_eve_szoveg: "object"      # a portál szöveges korszak-mezője (pl. "1950 előtt")
  epites_eve_becsult: "float64"
  erkely_nm: "float64"
  szobaszam_egesz: "float64"
  szobaszam_fel: "float64"
  atlagos_szobameret_nm: "float64"
  emelet: "object"
  emelet_szam: "float64"
  epulet_szintjei_szam: "float64"
  is_magas_emelet_lift_nelkul: "int64"
  futes: "object"
  futes_kategoria: "object"
  has_tavfutes: "int64"
  has_konvektor: "int64"
  has_megujulo: "int64"
  has_garazs_vagy_beallo: "int64"
  energetikai_tanusitvany: "object"
  butorozott: "object"
  koltozheto: "object"
  min_berleti_ido: "object"
  kertkapcsolatos: "object"
  kozos_koltseg_huf: "float64"
  rezsikoltseg_huf: "float64"
  kaucio_huf: "float64"
  hirdeto_tipus: "object"
  iroda_neve: "object"
  leiras: "object"                 # a hirdetés teljes szövege (nyers)
  oldal_allapot: "object"          # hirdetes | 404 | egyeb (a letöltött lap állapota)
  leiras_hossz: "float64"
  fenykepek_szama: "float64"

  # A portál-koordináták CSAK nyers mellékinformációként (soha nem pontosak!)
  lat_portal: "float64"
  lon_portal: "float64"
  portal_pozicio_sugar_m: "float64"

  # Valuta (EUR-os területek)
  price_eur: "float64"
  nm_ar_eur: "float64"
  kozos_koltseg_eur: "float64"
  rezsikoltseg_eur: "float64"
  kaucio_eur: "float64"

  # Budapest-specifikus nyers mezők
  parkolas: "object"
  parkolohely_ara: "float64"
  parkolohelyek_szama: "float64"
  pince: "object"
  napelem: "object"
  komfort: "object"
  belmagassag_raw: "object"
  akadalymentesitett: "object"
  furdo_wc: "object"
  tajolas: "object"
  kilatas: "object"
  szigeteles: "object"
  tetoter: "object"
  panelprogram: "object"
  gepesitett: "object"
  kisallat: "object"
  dohanyzas: "object"
  atlag_gazfogyasztas: "object"
  atlag_aramfogyasztas: "object"

  # Városi tömegközlekedési izokrónok
  tavolsag_metro_halozati_m: "float64"
  menetido_metro_gyalog_perc: "float64"
  metro_5p_seta: "int64"
  metro_10p_seta: "int64"
  metro_15p_seta: "int64"
  tavolsag_villamos_halozati_m: "float64"
  menetido_villamos_gyalog_perc: "float64"
  villamos_5p_seta: "int64"
  villamos_10p_seta: "int64"
  villamos_15p_seta: "int64"
  tavolsag_busz_halozati_m: "float64"
  menetido_busz_gyalog_perc: "float64"
  busz_5p_seta: "int64"
  busz_10p_seta: "int64"
  busz_15p_seta: "int64"
  tavolsag_kotottpalya_halozati_m: "float64"
  menetido_kotottpalya_gyalog_perc: "float64"
  kotottpalya_5p_seta: "int64"
  kotottpalya_10p_seta: "int64"
  kotottpalya_15p_seta: "int64"
  tavolsag_park_halozati_m: "float64"
  menetido_park_gyalog_perc: "float64"
  park_5p_seta: "int64"
  park_10p_seta: "int64"
  park_15p_seta: "int64"

  # POI-sávok (hálózati elérhetőség)
  poi_5p_count: "float64"
  poi_10p_count: "float64"
  poi_15p_count: "float64"

  # Intézményi hálózati távolságok és izokrónok
  tavolsag_iskola_halozati_m: "float64"
  iskola_5p_seta: "int64"
  iskola_10p_seta: "int64"
  iskola_15p_seta: "int64"
  tavolsag_ovoda_halozati_m: "float64"
  ovoda_5p_seta: "int64"
  ovoda_10p_seta: "int64"
  ovoda_15p_seta: "int64"
  tavolsag_bolt_halozati_m: "float64"
  bolt_5p_seta: "int64"
  bolt_10p_seta: "int64"
  bolt_15p_seta: "int64"
  tavolsag_gyogyszertar_halozati_m: "float64"
  gyogyszertar_5p_seta: "int64"
  gyogyszertar_10p_seta: "int64"
  gyogyszertar_15p_seta: "int64"
  tavolsag_orvos_halozati_m: "float64"
  orvos_5p_seta: "int64"
  orvos_10p_seta: "int64"
  orvos_15p_seta: "int64"

  # Legközelebbi célpontok nevei (térképekhez)
  legkozelebbi_vasut: "object"
  legkozelebbi_metro: "object"
  legkozelebbi_villamos: "object"
  legkozelebbi_busz: "object"
  legkozelebbi_park: "object"
  legkozelebbi_kotottpalya_tipus: "object"

# ==============================================================================
# Szabály: a forrás-rétegben maradó, nem mappelt oszlopok SOHA nem kerülnek
